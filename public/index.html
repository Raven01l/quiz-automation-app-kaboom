<!DOCTYPE html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <!-- viewport-fit=cover lets the app use the full screen on phones with a notch -->
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no, viewport-fit=cover" />
    <title>Kaboom! Bilgi Yarışması</title>
    <meta name="description" content="Hızlı ve eğlenceli bilgi yarışması: 6 kategori, canlı düello, Türkçe ve İngilizce." />

    <!-- "Add to Home Screen" support (Android and iPhone) -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#7C3AED" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Kaboom!" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />

    <!-- Link previews (WhatsApp, Instagram, etc.) -->
    <meta property="og:title" content="Kaboom! Bilgi Yarışması" />
    <meta property="og:description" content="Arkadaşınla canlı düello yap, en hızlı doğru cevap kazansın." />
    <meta property="og:image" content="/icons/icon-512.png" />
    <meta property="og:type" content="website" />

    <style id="expo-reset">
      html,
      body {
        height: 100%;
        margin: 0;
        background-color: #F6F4FF;
      }
      body {
        overflow: hidden;
      }
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>
  </head>
  <body>
    <noscript>Kaboom! çalışmak için JavaScript'e ihtiyaç duyar.</noscript>
    <div id="root"></div>
  </body>
</html>
